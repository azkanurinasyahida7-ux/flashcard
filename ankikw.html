<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anki English - Soft Pastel Edition</title>
    <style>
        /* TEMA: SOFT PASTEL LIGHT MODE */
        :root {
            --bg-color: #f7f9fa;       
            --card-bg: #ffffff;        
            --text-color: #3a4750;     
            --text-muted: #95a5a6;     
            --primary: #a8dadc;        
            --accent: #b7e4c7;         
            --border: #edf2f4;         
            
            /* Palet Tombol Review Pastel */
            --danger: #ffb7b2;         
            --warning: #ffdac1;        
            --success: #b5e2fa;        
        }

        /* RESET UNTUK MOBILE */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 24px 20px;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(149, 165, 166, 0.05);
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 15px;
            font-weight: 600;
            font-size: 20px;
            letter-spacing: -0.3px;
            color: var(--text-color);
        }

        /* TABS KAPSUL PASTEL */
        .tabs {
            display: flex;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            background: #e8ecef;
            padding: 4px;
            border-radius: 24px;
            margin-bottom: 16px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #6c757d;
            padding: 10px 4px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: #2d6a4f; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        /* FORM STYLING */
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-color);
        }

        textarea {
            width: 100%;
            padding: 14px;
            background-color: #fdfdfd;
            color: var(--text-color);
            border: 1px solid var(--border);
            border-radius: 16px;
            resize: none;
            box-sizing: border-box;
            font-size: 15px;
            font-family: inherit;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
        }

        /* BUTTON STYLING */
        .btn-main {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 24px;
            background-color: var(--primary);
            color: #3a4750;
            font-size: 15px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(168, 218, 220, 0.2);
        }

        /* FLASHCARD BOX ANTI AMBLES */
        .flashcard-box {
            width: 100%;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            text-align: center;
            background: #fbfbfb;
            cursor: pointer;
            overflow: hidden;
        }

        .card-content {
            width: 100%;
            word-wrap: break-word;
            word-break: break-all; /* Jaminan teks panjang tanpa spasi otomatis patah baris */
            overflow-wrap: break-word;
        }

        .english-word {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-color);
            display: block;
            line-height: 1.3;
        }

        .translation-text {
            font-size: 18px;
            font-weight: 500;
            color: #4a5568;
            display: block;
            line-height: 1.4;
        }

        .card-hint {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 16px;
        }

        /* BOTTOM ACTION BUTTONS */
        .action-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 12px;
            width: 100%;
        }

        .btn-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .time-indicator {
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-muted);
        }

        .btn-review {
            width: 100%;
            padding: 12px 2px;
            font-size: 13px;
            border-radius: 16px;
            border: none;
            color: #3a4750; 
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .btn-easy { background-color: var(--success); }
        .btn-medium { background-color: var(--warning); }
        .btn-hard { background-color: var(--danger); }

        .status-text {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .hidden { display: none !important; }

        /* KUNCI UTAMA: TAMPILAN TABLE DATABASE */
        .db-table-wrapper {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--card-bg);
            margin-top: 12px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            table-layout: fixed;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }
        
        td {
            height: 100%; /* Paksa tinggi sel mengikuti baris tertinggi */
        }

        th {
            background-color: #f7f9fa;
            color: var(--text-color);
            font-weight: 600;
            text-align: left;
        }

        .truncate-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            display: block;
        }

        tr.expanded .truncate-text {
            white-space: normal;
            overflow: visible;
            text-overflow: clip;
            word-wrap: break-word;
            word-break: break-all;
        }

        .clickable-row {
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .clickable-row:hover {
            background-color: #fdfdfd;
        }
        tr.expanded {
            background-color: #f8fafc;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
        }
        .status-due { background-color: #e8f5e9; color: #2e7d32; }
        .status-wait { background-color: #fff3e0; color: #e65100; }

        /* PERBAIKAN ABSOLUT: FORCE CENTER TOMBOL AKSI */
        .action-cell {
            padding: 0 8px !important; /* Hilangkan padding bawaan td biar tidak narik ke atas */
        }
        
        .action-inner-container {
            display: grid;
            align-content: center;
            justify-content: center;
            justify-items: center;
            height: 48px; /* Kunci tinggi minimum agar sejajar di tengah */
            width: 100%;
        }
        
        tr.expanded .action-inner-container {
            height: 70px; /* Lebarkan otomatis saat diekspansi */
        }

        .btn-action-container {
            display: none;
            gap: 4px;
            flex-direction: column;
            width: 100%;
        }
        
        tr.expanded .btn-action-container {
            display: flex;
        }
        tr:not(.expanded) .action-placeholder {
            display: block;
            color: var(--text-muted);
            font-size: 12px;
        }
        tr.expanded .action-placeholder {
            display: none;
        }

        .btn-small {
            padding: 5px 8px;
            font-size: 11px;
            width: 44px; /* Set lebar pasti biar simetris bulat kapsulnya */
            border-radius: 10px;
            color: #3a4750;
            font-weight: 600;
            border: none;
            cursor: pointer;
            text-align: center;
            line-height: 1.2;
        }

        .btn-edit { background-color: var(--warning); }
        .btn-delete { background-color: var(--danger); }
        .btn-cancel { background-color: #e2e8f0; margin-top: 8px; }
        .empty-state { text-align: center; padding: 30px; color: var(--text-muted); font-style: italic; }
    </style>
</head>
<body>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('review')">Review</button>
        <button class="tab-btn" onclick="switchTab('add')">Add Card</button>
        <button class="tab-btn" onclick="switchTab('database')">Deck (DB)</button>
    </div>

    <div id="review-section" class="container">
        <h2>Study Session</h2>
        <div id="status-counter" class="status-text">Loading deck...</div>
        
        <div class="flashcard-box" id="flashcard" onclick="flipCard()">
            <div id="card-body" class="card-content"></div>
            <div id="card-instruction" class="card-hint">Tap card to see definition</div>
        </div>

        <div id="answer-buttons" class="action-buttons hidden">
            <div class="btn-wrapper">
                <span id="time-hard" class="time-indicator">1 day</span>
                <button class="btn-review btn-hard" onclick="submitReview('hard')">Hard</button>
            </div>
            <div class="btn-wrapper">
                <span id="time-medium" class="time-indicator">2 days</span>
                <button class="btn-review btn-medium" onclick="submitReview('medium')">Good</button>
            </div>
            <div class="btn-wrapper">
                <span id="time-easy" class="time-indicator">4 days</span>
                <button class="btn-review btn-easy" onclick="submitReview('easy')">Easy</button>
            </div>
        </div>
        
        <button id="show-answer-btn" class="btn-main" onclick="flipCard()">Show Answer</button>
    </div>

    <div id="add-section" class="container hidden">
        <h2 id="form-title">Create New Card</h2>
        <input type="hidden" id="edit-card-id" value="">
        
        <div class="form-group">
            <label for="front">Front Side (English Word / Sentence):</label>
            <textarea id="front" rows="3" placeholder="e.g., Obtain or Essential"></textarea>
        </div>
        <div class="form-group">
            <label for="back">Back Side (Meaning / Explanation):</label>
            <textarea id="back" rows="3" placeholder="e.g., Mendapatkan sesuatu atau sangat penting."></textarea>
        </div>
        <button id="save-btn" class="btn-main" onclick="saveCard()">Save to Deck</button>
        <button id="cancel-edit-btn" class="btn-small btn-cancel hidden" onclick="resetForm()">Cancel Edit</button>
        <div id="save-success" class="status-text" style="color: #2d6a4f; font-weight: 600; margin-top: 10px;"></div>
    </div>

    <div id="database-section" class="container hidden">
        <h2>Deck Database</h2>
        <div id="db-summary" class="status-text">0 cards stored</div>
        
        <div class="db-table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="width: 36%">Front</th>
                        <th style="width: 36%">Back</th>
                        <th style="width: 16%">Status</th>
                        <th style="width: 12%; text-align: center;">Edit</th>
                    </tr>
                </thead>
                <tbody id="database-table-body">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        let deck = JSON.parse(localStorage.getItem('anki_deck')) || [];
        let currentCardIndex = -1;
        let isFlipped = false;
        let activeReviewQueue = [];

        function initApp() {
            filterReviewQueue();
            showNextCard();
            renderDatabaseTable();
        }

        function filterReviewQueue() {
            const now = Date.now();
            activeReviewQueue = deck.filter(card => !card.nextReview || card.nextReview <= now);
        }

        function calculateRemainingTime(nextReviewTimestamp) {
            if (!nextReviewTimestamp) return `<span class="status-badge status-due">Due</span>`;
            const now = Date.now();
            const diffMs = nextReviewTimestamp - now;
            if (diffMs <= 0) return `<span class="status-badge status-due">Due</span>`;
            const oneDayMs = 24 * 60 * 60 * 1000;
            const remainingDays = Math.ceil(diffMs / oneDayMs);
            return `<span class="status-badge status-wait">${remainingDays}d</span>`;
        }

        function showNextCard() {
            const cardBody = document.getElementById('card-body');
            const cardInstruction = document.getElementById('card-instruction');
            const showAnswerBtn = document.getElementById('show-answer-btn');
            const answerButtons = document.getElementById('answer-buttons');
            const statusCounter = document.getElementById('status-counter');

            isFlipped = false;
            answerButtons.classList.add('hidden');

            if (activeReviewQueue.length === 0) {
                cardBody.innerHTML = "<span class='translation-text'>🎉 All caught up for today!</span>";
                cardInstruction.innerText = "Check back tomorrow for your next daily review.";
                showAnswerBtn.classList.add('hidden');
                statusCounter.innerText = `Total deck size: ${deck.length} cards`;
                currentCardIndex = -1;
                return;
            }

            const currentCard = activeReviewQueue[0];
            currentCardIndex = deck.findIndex(c => c.id === currentCard.id);
            const card = deck[currentCardIndex];
            
            cardBody.innerHTML = `<span class="english-word">${card.front}</span>`;
            cardInstruction.innerText = "Tap card to show definition";
            showAnswerBtn.classList.remove('hidden');
            statusCounter.innerText = `Remaining reviews today: ${activeReviewQueue.length}`;
        }

        function flipCard() {
            if (currentCardIndex === -1 || isFlipped) return;

            const cardBody = document.getElementById('card-body');
            const cardInstruction = document.getElementById('card-instruction');
            const showAnswerBtn = document.getElementById('show-answer-btn');
            const answerButtons = document.getElementById('answer-buttons');

            const card = deck[currentCardIndex];
            
            cardBody.innerHTML = `
                <span class="english-word">${card.front}</span>
                <div style="margin-top: 15px; border-top: 1px dashed var(--border); padding-top: 12px;">
                    <span class="translation-text">${card.back}</span>
                </div>
            `;
            
            cardInstruction.innerText = "How well did you know this card?";

            const currentInterval = card.intervalDays || 0;
            const nextMediumDays = currentInterval === 0 ? 2 : Math.round(currentInterval * 1.5);
            const nextEasyDays = currentInterval === 0 ? 4 : Math.round(currentInterval * 2.5);

            document.getElementById('time-hard').innerText = "1 day";
            document.getElementById('time-medium').innerText = `${nextMediumDays} days`;
            document.getElementById('time-easy').innerText = `${nextEasyDays} days`;
            
            showAnswerBtn.classList.add('hidden');
            answerButtons.classList.remove('hidden');
            isFlipped = true;
        }

        function submitReview(difficulty) {
            if (currentCardIndex === -1) return;

            const now = Date.now();
            const card = deck[currentCardIndex];
            let newIntervalDays = 1;

            if (difficulty === 'hard') {
                newIntervalDays = 1; 
                card.intervalDays = 0; 
            } else if (difficulty === 'medium') {
                newIntervalDays = (card.intervalDays === 0 || !card.intervalDays) ? 2 : Math.round(card.intervalDays * 1.5);
                card.intervalDays = newIntervalDays;
            } else if (difficulty === 'easy') {
                newIntervalDays = (card.intervalDays === 0 || !card.intervalDays) ? 4 : Math.round(card.intervalDays * 2.5);
                card.intervalDays = newIntervalDays;
            }

            const oneDayMs = 24 * 60 * 60 * 1000;
            card.nextReview = now + (newIntervalDays * oneDayMs);
            
            saveDeckToStorage();
            filterReviewQueue();
            showNextCard();
        }

        function saveCard() {
            const frontInput = document.getElementById('front');
            const backInput = document.getElementById('back');
            const editIdInput = document.getElementById('edit-card-id');
            const successMsg = document.getElementById('save-success');

            if (!frontInput.value.trim() || !backInput.value.trim()) {
                alert("Please fill out both sides of the card!");
                return;
            }

            if (editIdInput.value) {
                const idToEdit = parseInt(editIdInput.value);
                const targetIdx = deck.findIndex(c => c.id === idToEdit);
                if (targetIdx !== -1) {
                    deck[targetIdx].front = frontInput.value;
                    deck[targetIdx].back = backInput.value;
                    successMsg.innerText = "Card successfully updated!";
                }
            } else {
                const newCard = {
                    id: Date.now(),
                    front: frontInput.value,
                    back: backInput.value,
                    nextReview: 0, 
                    intervalDays: 0
                };
                deck.push(newCard);
                successMsg.innerText = "Card successfully saved!";
            }

            saveDeckToStorage();
            resetForm();
            filterReviewQueue();
            renderDatabaseTable();

            setTimeout(() => successMsg.innerText = '', 2000);
        }

        function toggleRowExpansion(rowElement) {
            const isExpanded = rowElement.classList.contains('expanded');
            document.querySelectorAll('#database-table-body tr').forEach(tr => tr.classList.remove('expanded'));
            if (!isExpanded) {
                rowElement.classList.contains('clickable-row') && rowElement.classList.add('expanded');
            }
        }

        function startEditCard(id, event) {
            if(event) event.stopPropagation(); 
            const targetCard = deck.find(c => c.id === id);
            if (!targetCard) return;

            document.getElementById('front').value = targetCard.front;
            document.getElementById('back').value = targetCard.back;
            document.getElementById('edit-card-id').value = targetCard.id;

            document.getElementById('form-title').innerText = "Edit Flashcard";
            document.getElementById('save-btn').innerText = "Save Changes";
            document.getElementById('cancel-edit-btn').classList.remove('hidden');

            switchTab('add');
        }

        function deleteCard(id, event) {
            if(event) event.stopPropagation(); 
            if (confirm("Are you sure you want to delete this card?")) {
                deck = deck.filter(c => c.id !== id);
                saveDeckToStorage();
                filterReviewQueue();
                renderDatabaseTable();
                if (currentCardIndex !== -1) showNextCard();
            }
        }

        function resetForm() {
            document.getElementById('front').value = '';
            document.getElementById('back').value = '';
            document.getElementById('edit-card-id').value = '';
            document.getElementById('form-title').innerText = "Create New Card";
            document.getElementById('save-btn').innerText = "Save to Deck";
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        }

        function renderDatabaseTable() {
            const tableBody = document.getElementById('database-table-body');
            const summaryText = document.getElementById('db-summary');
            
            summaryText.innerText = `Total stored: ${deck.length} cards`;
            tableBody.innerHTML = '';

            if (deck.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" class="empty-state">No cards in your database yet. Go add some!</td></tr>`;
                return;
            }

            deck.forEach(card => {
                const tr = document.createElement('tr');
                tr.className = 'clickable-row';
                tr.onclick = function() { toggleRowExpansion(this); };
                
                const reviewStatusNode = calculateRemainingTime(card.nextReview);

                tr.innerHTML = `
                    <td><span class="truncate-text"><strong>${escapeHtml(card.front)}</strong></span></td>
                    <td><span class="truncate-text">${escapeHtml(card.back)}</span></td>
                    <td>${reviewStatusNode}</td>
                    <td class="action-cell">
                        <div class="action-inner-container">
                            <span class="action-placeholder">⚙️</span>
                            <div class="btn-action-container">
                                <button class="btn-small btn-edit" onclick="startEditCard(${card.id}, event)">Edit</button>
                                <button class="btn-small btn-delete" onclick="deleteCard(${card.id}, event)">Del</button>
                            </div>
                        </div>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        function saveDeckToStorage() {
            localStorage.setItem('anki_deck', JSON.stringify(deck));
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function switchTab(tab) {
            const reviewSec = document.getElementById('review-section');
            const addSec = document.getElementById('add-section');
            const dbSec = document.getElementById('database-section');
            const tabs = document.querySelectorAll('.tab-btn');

            tabs.forEach(t => t.classList.remove('active'));

            reviewSec.classList.add('hidden');
            addSec.classList.add('hidden');
            dbSec.classList.add('hidden');

            if (tab === 'review') {
                reviewSec.classList.remove('hidden');
                tabs[0].classList.add('active');
                showNextCard();
            } else if (tab === 'add') {
                addSec.classList.remove('hidden');
                tabs[1].classList.add('active');
            } else if (tab === 'database') {
                dbSec.classList.remove('hidden');
                tabs[2].classList.add('active');
                renderDatabaseTable();
            }
        }

        initApp();
    </script>
</body>
</html>
